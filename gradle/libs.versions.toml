version-catalog-update = { module = "com.github.ben-manes.versions", version.ref = "versionCatalogUpdate" }

[bundles]
# Common Android dependencies
androidx-core = ["androidx-core-ktx", "androidx-activity-compose", "androidx-lifecycle-runtime-ktx", "androidx-savedstate"]
androidx-lifecycle = ["androidx-lifecycle-viewmodel-compose", "androidx-lifecycle-viewmodel-ktx"]
compose = ["material3", "material-icons-extended", "compose-animation", "compose-navigation", "compose-navigation-hilt"]
hilt = ["hilt-android", "hilt-navigation-compose"]
coroutines = ["kotlinx-coroutines-core", "kotlinx-coroutines-android"]
serialization = ["kotlinx-serialization-json"]
room = ["room-runtime", "room-ktx"]
datastore = ["datastore-preferences"]
network = ["retrofit", "retrofit-gson-converter", "retrofit-kotlinx-serialization-converter", "okhttp", "okhttp-logging-interceptor", "okio", "gson"]
coil = ["coil-compose", "coil-network-okhttp"]
firebase = ["firebase-auth-ktx", "firebase-analytics-ktx", "firebase-crashlytics-ktx", "firebase-messaging-ktx", "firebase-config-ktx"]
ads-admob = ["play-services-ads", "user-messaging-platform"]
ads-unity = ["unity-ads", "unity-levelplay"]
testing-unit = ["junit", "junit-jupiter", "kotlin-test", "kotlin-test-junit", "mockk", "turbine", "robolectric"]
testing-instrumented = ["espresso-core", "espresso-contrib", "espresso-intents", "androidx-test-runner", "androidx-test-rules", "truth", "compose-testing", "hilt-testing"]