# Detekt Configuration for MyApplication
# Based on official detekt config with project-specific adjustments

build:
  maxIssues: 100
  weights:
    # Style weights
    commentsWeight: 1
    complexityWeight: 2
    formattingWeight: 1
    namingWeight: 1
    styleWeight: 1
    # Rule weights
    complexityWeight: 2
    exceptionHandlingWeight: 2
    potentialBugsWeight: 3
    formattingWeight: 1
    namingWeight: 1
    styleWeight: 1

config:
  validation: true
  warnsAsErrors: false

# ==================== FORMATTING ====================
formatting:
  # Use ktlint-style formatting
  ktlint:
    disabled: false
  # Maximum line length
  maxLineLength:
    maxLineLength: 120
    excludePackageStatements: true
    excludeImportStatements: true
  # No wildcards in imports
  noWildcardImports:
    enabled: true
  # No consecutive blank lines
  noConsecutiveBlankLines:
    enabled: true
  # No empty first line in method body
  noEmptyFirstLineInMethodBody:
    enabled: true
  # No multiple spaces
  noMultipleSpaces:
    enabled: true
  # Function spacing
  functionSpacing:
    enabled: true
  # Import ordering
  importOrdering:
    enabled: true
    layout:
      - ".*\\.kt"
      - ".*\\.java"
      - ""
      - "android.*"
      - "androidx.*"
      - "com.google.*"
      - "com.example.*"
      - ""
      - ".*"
    alphabeticalOrder: true
  # Indentation
  indentation:
    enabled: true
    indentSize: 4
    continuationIndentSize: 4
  # Wrapping
  wrapping:
    enabled: true
    maxLineLength: 120

# ==================== NAMING ====================
naming:
  # Package naming
  packageNaming:
    enabled: true
    pattern: '^[a-z]+(\.[a-z][a-z0-9]*)*$'
  # Class naming
  classNaming:
    enabled: true
    pattern: '^[A-Z][a-zA-Z0-9]*$'
    exclude:
      - '^.*Test$'
      - '^.*TestCase$'
  # Function naming
  functionNaming:
    enabled: true
    pattern: '^[a-z][a-zA-Z0-9]*$'
    exclude:
      - '^.*_test$'
      - '^.*_Test$'
  # Variable naming
  variableNaming:
    enabled: true
    pattern: '^[a-z][a-zA-Z0-9]*$'
    privatePropertyPattern: '^(_)?[a-z][a-zA-Z0-9]*$'
    exclude:
      - '^.*_test$'
  # Constant naming
  constantNaming:
    enabled: true
    pattern: '^[A-Z][A-Z0-9_]*$'
  # Parameter naming
  parameterNaming:
    enabled: true
    pattern: '^[a-z][a-zA-Z0-9]*$'

# ==================== STYLE ====================
style:
  # Magic numbers
  magicNumber:
    enabled: true
    ignoredNumbers:
      - '-1'
      - '0'
      - '1'
      - '2'
      - '3'
      - '10'
      - '100'
      - '1000'
    ignoreAnnotation: true
    ignoreNamedArgument: true
    ignorePropertyDeclaration: true
    ignoreLocalVariableDeclaration: true
    ignoreConstantDeclaration: true
    ignoreFunctionArgument: true
    ignoreEnumEntry: true
  # Explicit types
  explicitTypes:
    enabled: true
    ignoreAnnotated: true
    ignoreAnnotatedProperty: true
  # No unused imports
  unusedImports:
    enabled: true
  # No unused private members
  unusedPrivateMember:
    enabled: true
    allowedAnnotations:
      - 'Suppress'
      - 'SuppressWarnings'
      - 'Keep'
      - 'JvmStatic'
      - 'JvmField'
      - 'JvmOverloads'
      - 'JvmName'
      - 'JvmDefault'
      - 'Inject'
      - 'Provides'
      - 'Binds'
      - 'Module'
      - 'InstallIn'
      - 'HiltViewModel'
      - 'AndroidEntryPoint'
      - 'HiltAndroidApp'
  # Mandatory braces
  mandatoryBracesIfStatements:
    enabled: true
  mandatoryBracesLoopStatements:
    enabled: true
  # No empty blocks
  emptyBlocks:
    enabled: true
  # Return count
  returnCount:
    enabled: true
    max: 6
    excludedFunctions:
      - 'equals'
      - 'hashCode'
      - 'toString'
  # Too many functions
  tooManyFunctions:
    enabled: true
    thresholdInFiles: 11
    thresholdInClasses: 11
    thresholdInInterfaces: 11
    thresholdInObjects: 11
    thresholdInEnums: 11
    ignoreDeprecated: false
    ignorePrivate: false
    ignoreOverridden: false

# ==================== COMPLEXITY ====================
complexity:
  # Long methods
  longMethod:
    enabled: true
    threshold: 60
  # Long parameter list
  longParameterList:
    enabled: true
    threshold: 6
    ignoreDefaultParameters: true
    ignoreDataClasses: true
    ignoreAnnotated:
      - 'Composable'
      - 'Inject'
  # Complex methods
  complexMethod:
    enabled: true
    threshold: 15
    ignoreSimpleWhenEntries: true
    ignoreSingleWhenExpression: true
  # Too many statements
  tooManyStatements:
    enabled: true
    threshold: 30
  # Nested block depth
  nestedBlockDepth:
    enabled: true
    threshold: 4
  # Labeled expressions
  labeledExpression:
    enabled: true
    ignoredLabels:
      - 'outer'
      - 'inner'

# ==================== EXCEPTION HANDLING ====================
exceptionHandling:
  # Empty catch block
  emptyCatchBlock:
    enabled: true
  # Not implemented exception
  notImplementedException:
    enabled: true
  # Throwing exceptions in main
  throwingExceptionInMain:
    enabled: true
  # Too generic exception caught
  tooGenericExceptionCaught:
    enabled: true
    excludedExceptionNames:
      - 'Exception'
      - 'Throwable'
      - 'Error'
  # Throwing new instance of same exception
  throwingNewInstanceOfSameException:
    enabled: true

# ==================== POTENTIAL BUGS ====================
potentialBugs:
  # Null pointer
  nullPointer:
    enabled: true
  # Unsafe cast
  unsafeCast:
    enabled: true
  # Unused parameter
  unusedParameter:
    enabled: true
    ignoreOverride: true
    ignoreLambda: true
  # Lateinit usage
  lateinitUsage:
    enabled: true
  # Missing default case in when
  missingDefaultCase:
    enabled: true
  # Spread operator
  spreadOperator:
    enabled: true
  # Iterator has next
  iteratorHasNext:
    enabled: true
  # Float precision
  floatPrecisionComparison:
    enabled: true
  # Missing override
  missingOverride:
    enabled: true

# ==================== COMMENTS ====================
comments:
  # Comment over private function
  commentOverPrivateFunction:
    enabled: false
  # Comment over private property
  commentOverPrivateProperty:
    enabled: false
  # End of line comment
  endOfLineComment:
    enabled: false
  # TODO comments
  todo:
    enabled: true
    excludedTags: []

# ==================== ANDROID SPECIFIC ====================
# Custom rules for Android

# Disabled rules with explanations
disabledRules:
  # Allow explicit types for clarity in public APIs
  - ExplicitTypes
  # Allow magic numbers in tests
  - MagicNumber
  # Allow nested blocks in Compose
  - NestedBlockDepth
  # Allow long methods in generated code
  - LongMethod
  # Allow long parameter lists in Compose functions
  - LongParameterList