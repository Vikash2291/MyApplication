name: Android CI

on:
  push:
    branches: [main, develop, 'complete-*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests & debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      # Optional: store your Firebase config as a base64 secret named GOOGLE_SERVICES_JSON.
      - name: Add google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        if: env.GOOGLE_SERVICES_JSON != ''
        run: echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Release AAB (R8 + resource shrinking). Signed with the release key only when the
      # keystore secrets are present (main-branch job below); otherwise debug-signed for the check.
      - name: Build release bundle
        run: ./gradlew bundleRelease --stacktrace

      - name: Static analysis (non-blocking)
        run: ./gradlew detekt
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: release-aab-unsigned-check
          path: app/build/outputs/bundle/release/*.aab

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: '**/build/reports/tests/'

  release:
    name: Signed release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      - name: Prepare secrets
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$RELEASE_KEYSTORE" ]; then echo "$RELEASE_KEYSTORE" | base64 -d > release.keystore;
          elif [ -n "$KEYSTORE_PASSWORD" ] && [ -f signing/release.keystore.gpg ]; then
            # Keystore is committed only in AES-256 encrypted form; decrypted with the KEYSTORE_PASSWORD secret.
            gpg --batch --quiet --pinentry-mode loopback --passphrase "$KEYSTORE_PASSWORD" -d signing/release.keystore.gpg > release.keystore
          fi
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json; fi

      - name: Build release APK & AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
