name: Android CI

on:
  push:
    branches: [main, develop, 'complete-*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests & debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      # Optional: store your Firebase config as a base64 secret named GOOGLE_SERVICES_JSON.
      - name: Add google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        if: env.GOOGLE_SERVICES_JSON != ''
        run: echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Release AAB (R8 + resource shrinking). Signed with the release key only when the
      # keystore secrets are present (main-branch job below); otherwise debug-signed for the check.
      - name: Build release bundle
        run: ./gradlew bundleRelease --stacktrace

      - name: Static analysis (non-blocking)
        run: ./gradlew detekt
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: release-aab-unsigned-check
          path: app/build/outputs/bundle/release/*.aab

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: '**/build/reports/tests/'

  release:
    name: Signed release
    runs-on: ubuntu-latest
    needs: build
    # main, release-candidate branches (complete-*) and manual runs. Pull requests never get secrets.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/complete-')))
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      - name: Check signing secrets (names only)
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=0
          for n in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD RELEASE_KEYSTORE; do
            if [ -n "${!n}" ]; then echo "$n: present"; else echo "$n: missing"; fi
          done
          for n in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do [ -n "${!n}" ] || missing=1; done
          if [ "$missing" = 1 ]; then echo "::error::Release signing secrets missing"; exit 1; fi

      - name: Prepare secrets
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$RELEASE_KEYSTORE" ]; then echo "$RELEASE_KEYSTORE" | base64 -d > release.keystore;
          elif [ -n "$KEYSTORE_PASSWORD" ] && [ -f signing/release.keystore.gpg ]; then
            # Keystore is committed only in AES-256 encrypted form; decrypted with the KEYSTORE_PASSWORD secret.
            gpg --batch --quiet --pinentry-mode loopback --passphrase "$KEYSTORE_PASSWORD" -d signing/release.keystore.gpg > release.keystore
          fi
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json; fi
          # Never fall back to debug signing for a release artifact.
          if [ ! -s release.keystore ]; then echo "::error::release.keystore not available"; exit 1; fi

      - name: Build release APK & AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Verify signatures, versions and ad config
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          AAB=$(ls app/build/outputs/bundle/release/*.aab | head -1)
          echo "== APK: $APK"; "$BT/apksigner" verify --verbose --print-certs "$APK" | tee apk-cert.txt
          echo "== AAB: $AAB"; jarsigner -verify "$AAB" | tail -1
          keytool -printcert -jarfile "$AAB" | tee aab-cert.txt
          if grep -q "CN=Android Debug" apk-cert.txt aab-cert.txt; then echo "::error::debug-signed artifact"; exit 1; fi
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" apk-cert.txt
          APK_SHA=$(grep -m1 "certificate SHA-256 digest" apk-cert.txt | awk '{print $NF}' | tr 'a-f' 'A-F')
          AAB_SHA=$(grep -m1 "SHA256:" aab-cert.txt | awk '{print $NF}' | tr -d ':')
          echo "APK cert SHA-256: $APK_SHA"; echo "AAB cert SHA-256: $AAB_SHA"
          [ "$APK_SHA" = "$AAB_SHA" ] || { echo "::error::APK and AAB signed with different keys"; exit 1; }
          "$BT/aapt2" dump badging "$APK" | grep -E "^package:|^sdkVersion|^targetSdkVersion|uses-permission" | tee badging.txt
          grep -q "versionCode='1'" badging.txt && grep -q "versionName='1.0.0'" badging.txt
          # Release must carry the production AdMob app id and no Google test ad units.
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK" | grep -A1 "com.google.android.gms.ads.APPLICATION_ID" | tee admob.txt
          grep -q "ca-app-pub-8988139914000617~" admob.txt
          "$BT/aapt2" dump resources "$APK" | grep -A1 "admob_.*_ad_unit_id" | tee units.txt || true
          if "$BT/aapt2" dump strings "$APK" | grep -q "ca-app-pub-3940256099942544"; then echo "::error::test ad ids in release"; exit 1; fi
          {
            echo "### Signed release"; echo "- versionCode 1 / versionName 1.0.0"
            echo "- Signing cert SHA-256: \`$APK_SHA\`"; echo "- APK + AAB signed with the same release key"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab

      - uses: actions/upload-artifact@v4
        with:
          name: release-mapping
          path: app/build/outputs/mapping/release/

  smoke:
    name: Emulator smoke tests (API 34)
    runs-on: ubuntu-latest
    needs: release
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release-artifacts

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build debug + androidTest APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Instrumented quiz flow (debug) + release smoke (R8, signed)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            ./gradlew connectedDebugAndroidTest --stacktrace
            python3 scripts/ci/release_smoke.py "$(ls release-artifacts/apk/release/*.apk | head -1)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: app/build/reports/androidTests/
