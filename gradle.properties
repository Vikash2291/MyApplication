# Project-wide Gradle settings
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override* any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
org.gradle.parallel=true

# Configure caching to speed up builds
org.gradle.caching=true

# Configure Gradle to use the configuration cache
org.gradle.configuration-cache=true

# Kotlin daemon settings
kotlin.daemon.jvm.options=-Xmx2048m

# AndroidX namespace
android.nonTransitiveRClass=true
android.enableArtifactTransforms=true

# R8 / ProGuard
android.enableR8.fullMode=true
android.enableR8.libraries=true

# Build cache
android.buildCache.enabled=true

# Jetifier (for legacy libraries)
android.enableJetifier=true

# Namespace
android.nonFinalResIds=false

# KSP
ksp.incremental=true
ksp.useWorkersApi=true

# Compose Compiler
compose.compiler.metrics=false
compose.compiler.reports=false
compose.compiler.reports.destination=build/compose_reports

# Detekt
detekt.failOnError=false
detekt.maxIssues=100

# Version Catalog
versionCatalog.update.enabled=false